<div class="home-container">
  <mat-card class="home-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon class="title-icon">account_circle</mat-icon>
        Welcome, {{ username }}!
      </mat-card-title>
      <mat-card-subtitle>Session started successfully</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p class="info-text">You are authenticated in the application.</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="warn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Log Out
      </button>
    </mat-card-actions>
  </mat-card>
</div>
